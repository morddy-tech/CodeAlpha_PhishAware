[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    "migrations",
    "staticfiles",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = [
    "accounts",
    "config",
    "core",
    "dashboard",
    "progress",
    "quizzes",
    "simulations",
    "training",
    "tests",
]
