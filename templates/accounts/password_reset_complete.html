{% extends "base.html" %}

{% block title %}Password changed{% endblock %}

{% block content %}
<div class="container container-narrow">
  <div class="card auth-card text-center">
    {% include "includes/svg.html" with name="check-circle" %}
    <h1>Password changed</h1>
    <p class="text-muted">Your password has been reset successfully. You can now log in with your new password.</p>
    <a class="btn btn-primary" href="{% url 'accounts:login' %}">Log in</a>
  </div>
</div>
{% endblock %}
