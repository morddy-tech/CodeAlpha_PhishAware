{% for field in form %}
  <div class="form-field">
    <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="text-faint"> *</span>{% endif %}</label>
    {{ field }}
    {% if field.help_text %}<div class="help-text">{{ field.help_text|safe }}</div>{% endif %}
    {% if field.errors %}<ul class="errorlist">{{ field.errors }}</ul>{% endif %}
  </div>
{% endfor %}
