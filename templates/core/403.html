{% extends "base.html" %}

{% block title %}Access denied{% endblock %}

{% block content %}
<div class="container container-narrow">
  <div class="card text-center">
    {% include "includes/svg.html" with name="lock" %}
    <h1>403 — Access denied</h1>
    <p class="text-muted">You don't have permission to view this page. This is a security control, not a bug.</p>
    <div class="flex" style="justify-content:center;gap:var(--space-3);flex-wrap:wrap;">
      <a class="btn btn-primary" href="{% url 'dashboard:home' %}">Go to dashboard</a>
      <a class="btn btn-secondary" href="{% url 'core:landing' %}">Return home</a>
    </div>
  </div>
</div>
{% endblock %}
